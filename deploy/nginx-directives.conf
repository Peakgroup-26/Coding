# Paste into Plesk: Websites & Domains > takeoff.peakgroupdashboard.com.au > Apache & nginx Settings >
# "Additional nginx directives". Change 8000 if install.sh picked another port.
#
# The "~ ^/" form takes priority over Plesk's own "location /", so there's no duplicate-location
# error, and Let's Encrypt renewals (/.well-known/acme-challenge/) keep working.

client_max_body_size 500m;

location ~ ^/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
