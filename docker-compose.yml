# Local or single-server deployment: the app plus PostgreSQL.
#   cp .env.example .env   # then fill it in
#   docker compose up --build -d
# Put HTTPS in front of it (a load balancer or reverse proxy) for anything beyond a trial.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: takeoff
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "takeoff"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://takeoff:${POSTGRES_PASSWORD}@db:5432/takeoff
    ports:
      - "8000:8000"
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  files:
