# Local or single-server deployment: the app plus PostgreSQL.
#   cp .env.example .env   # then fill it in
#   docker compose up --build -d
# Put HTTPS in front of it (Plesk, a load balancer or a reverse proxy). deploy/PLESK.md has the steps for Plesk.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: takeoff
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "takeoff"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://takeoff:${POSTGRES_PASSWORD}@db:5432/takeoff
    ports:
      # Only reachable from the server itself: Plesk's web server (nginx) forwards the website to it
      # over HTTPS. Change APP_PORT in .env if 8000 is already used on the server.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  files:
